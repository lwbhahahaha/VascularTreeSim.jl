# Coronary artery tree growth configuration
# For use with XCAT male50 heart phantom
# Parameters matched to v5 proven fine-resolution run

[organ]
name = "coronary"
nrb_path = "/home/molloi-lab/smb_mount/shared_drive/XCAT Phantom/xcat_adult_nrb_files/vmale50_heart.nrb"
phantom_path = "/home/molloi-lab/smb_mount/shared_drive/Shu Nie/PVAT_Analysis/digital phantoms/vmale50_1600x1400x500_8bit_little_endian_act_1.raw"
phantom_dims = [1600, 1400, 500]
coordinate_scale = 0.1  # XCAT NRB uses mm, we work in cm
embed_phantom_raw = false  # Step 5 (embed grown trees into XCAT raw volume). Costs ~5 min + 1 GB raw file. Set true if the raw output is actually consumed downstream (we currently only use the CSV output).

[surfaces]
outer = "dias_pericardium"
reference = "dias_aorta"
# Chamber cavities are subtracted via SDF flood-fill (no distance constraint).
# Tubular cavities (aorta, SVC, IVC) are auto-detected: their surface centroid
# falls outside outer_interior, so domain_builder applies a 2 cm max_distance
# constraint to prevent SDF over-subtraction far from the actual surface.
cavities = [
    "dias_lv_0",
    "dias_lv_1",
    "dias_lv_2",
    "dias_lv_3",
    "dias_lv_4",
    "dias_la",
    "dias_ra",
    "dias_rv",
    "dias_pul_art",
    "dias_aorta",
    "dias_sup_vc",
    "dias_inf_vc",
]

[[vessel_trees]]
name = "LAD"
surface_names = ["dias_lad1", "dias_lad2", "dias_lad3"]
color = "#1f77ff"
root_anchor_surface = "dias_aorta"
# target_flow_ml_min omitted on purpose → 1:1:1 uniform round-robin growth.
# Per-tree tree size / territory is shaped by the root_diameter_override_cm
# anatomical prior below (Dodge 1992 angiographic mean adult).
root_diameter_override_cm = 0.37   # LAD proximal 3.7 mm

[[vessel_trees]]
name = "LCX"
surface_names = ["dias_lcx"]
color = "#e3342f"
root_anchor_surface = "dias_aorta"
root_diameter_override_cm = 0.34   # LCX proximal 3.4 mm

[[vessel_trees]]
name = "RCA"
surface_names = ["dias_rca1", "dias_rca2"]
color = "#22aa44"
root_anchor_surface = "dias_aorta"
root_diameter_override_cm = 0.39   # RCA proximal 3.9 mm

[domain]
voxel_spacing_cm = 0.02         # Fine resolution (v5 fine run)
outer_samples = [96, 72]
cavity_samples = [56, 40]
dilation_radius = 1
coarse_seed_cm = [14.085, 21.628, 26.966]   # From coarse (0.05cm) midwall computation

# Restrict growth to the true myocardium (XCAT labels 15-18). At 0.02 cm the domain
# grid is 1:1 with the XCAT grid, so the muscle mask is captured accurately (~174 mL).
restrict_label_raw = "/home/molloi-lab/smb_mount/shared_drive/Shu Nie/PVAT_Analysis/digital phantoms/vmale50_1600x1400x500_8bit_little_endian_act_1.raw"
phantom_dims = [1600, 1400, 500]
phantom_voxel_cm = 0.02
nrb_to_phantom_offset_cm = [2.1443, -9.5553, -20.0068]
restrict_labels = [15, 16, 17, 18]
restrict_dilate_voxels = 1
restrict_replace = true   # build domain straight from XCAT muscle (NURBS sac covers only 22% of it)

[growth]
mode = "continue_from_xcat"     # Continue from existing XCAT LAD/LCX/RCA
effective_supply_radius_cm = 0.00125   # 12.5 μm
capillary_diameter_cm = 0.0008         # 8 μm  (legacy: kept for backwards compat)
terminal_diameter_cm = 0.02            # 200 μm — Murray-strict terminal (leaf) diameter for growth phase
subdivision_terminal_diameter_cm = 0.0006   # 6 μm (lower than 8 μm Pries F-L minimum, climbing onto capillary-viscosity-rise portion of Pries 1992 curve); was 0.0008
subdivision_clip_below_diameter_cm = 0.02   # clip ALL subdivision branches to the muscle domain (was 0.005, which let 50-200 μm escape)
subdivision_max_ld_ratio = 25.0             # post-subdivision safety net: split any residual L/d > 25 segment into shorter pieces at the same diameter
max_new_branches_per_tree = 200000     # very large cap — real stop is Murray budget exhaustion / coverage
graph_neighbors = 16                   # v5 fine run
min_frontier_separation_cm = 0.015     # v5 fine run
max_path_nodes = 20
frontier_batch = 28                    # v5 fine run
murray_gamma = 3.0
max_segment_length_cm = 0.1
smooth_passes = 20
spline_density = 5
coverage_stride = 3                    # densify: more 200μm terminals → denser capillary bed (was 4)
graph_stride = 8                       # densify: finer routing graph → terminals snap to ~1.2mm not 2.4mm (was 12)
graph_jitter_cm = 0.08                 # v5 fine run
turn_penalty = 0.5
target_p95_distance_cm = 0.005         # v5 fine run stopping criterion
target_max_distance_cm = 0.01          # v5 fine run stopping criterion
